[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qmemory"
version = "0.11.0"
description = "Local-first, multi-device project memory for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["ai", "agent", "memory", "mcp", "codex", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=8"]
gui = ["PySide6>=6.8,<7"]
desktop = ["mcp>=1.27,<2", "PySide6>=6.8,<7"]

[project.scripts]
qmemory = "qmemory.cli:main"
qmemory-gui = "qmemory.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
