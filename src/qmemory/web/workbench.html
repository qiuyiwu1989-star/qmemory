<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="qmemory-session" content="__SESSION__"><title>QMemory · 真实工作台</title><link rel="stylesheet" href="/workbench.css"><script src="/workbench.js" defer></script></head>
<body><header><strong>QMemory<span>.</span></strong><small>让工作留下可复用的经验</small><b class="badge">真实数据 · 只读</b><button id="refresh">刷新索引视图</button></header>
<div class="layout"><aside><label for="project">项目</label><select id="project"></select><input id="search" aria-label="搜索任务" placeholder="搜索任务…"><div id="tasks"></div><footer>私人本地空间<br>未上传 · 未连接云服务<br><small>只展示已归档索引，不触发同步</small></footer></aside>
<main><nav aria-label="工作视图"><button data-view="board" aria-pressed="true">任务看板</button><button data-view="story">故事画布</button><button data-view="map">记忆地图</button><button data-view="records">来源记录</button><span id="count"></span></nav><div id="notice" role="status"></div><section id="view"></section></main>
<section id="evidence" class="drawer" hidden aria-label="原始依据"><div class="drawer-head"><strong>来源依据</strong><button id="close">关闭</button></div><select id="source" aria-label="选择来源会话"></select><small id="version"></small><div id="messages"></div><div class="pager"><button id="prev">上一页</button><small id="page"></small><button id="next">下一页</button></div></section></div></body></html>
